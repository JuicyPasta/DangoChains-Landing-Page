<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">

	<title>{% if page.title %}{{ page.title }} | DangoChains{% else %}{{ site.page_title }}{% endif %}</title>
	<meta name="description" content="{{ page.description | default: site.app_description }}">

	<!-- Share cards (Reddit, Discord, X, iMessage link previews) -->
	<link rel="canonical" href="{{ page.url | absolute_url }}">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="DangoChains">
	<meta property="og:title" content="{% if page.title %}{{ page.title }} | DangoChains{% else %}{{ site.page_title }}{% endif %}">
	<meta property="og:description" content="{{ page.description | default: site.app_description }}">
	<meta property="og:url" content="{{ page.url | absolute_url }}">
	<meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}">
	<meta property="og:image:width" content="1024">
	<meta property="og:image:height" content="500">
	<meta name="twitter:card" content="summary_large_image">

	<!-- Static icons: search results and home screens read these without running JS -->
	<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
	<link rel="icon" type="image/png" sizes="48x48" href="{{ '/assets/icon-48.png' | relative_url }}">
	<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
	<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF7EF">
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1A17">

	<!-- Smart App Banner -->
	{% if site.enable_smart_app_banner %}
		<meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">
	{% endif %}

	<!-- One stylesheet for the whole site (DESIGN.md). The fonts load without blocking the first paint;
	     system fonts show until they arrive. -->
	{% assign asset_v = site.time | date: '%Y%m%d%H%M' %}
	<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ asset_v }}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	{% assign fonts_css = 'https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Nunito:wght@500..900&display=swap' %}
	<link rel="stylesheet" href="{{ fonts_css }}" media="print" onload="this.media='all'">
	<noscript><link rel="stylesheet" href="{{ fonts_css }}"></noscript>

	{% if site.google_analytics_id %}
	<!-- Google Analytics 4 (website only; the app itself has no analytics) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());
		// Every hit reports the address without its #fragment: custom boards (/play/#b=…) carry their words there.
		gtag('set', { page_location: location.href.split('#')[0] });
		gtag('config', '{{ site.google_analytics_id }}');
		// Store-button clicks are the landing page's conversion events.
		document.addEventListener('click', function (e) {
			var a = e.target.closest && e.target.closest('a.appStoreLink, a.playStoreLink');
			if (!a) return;
			gtag('event', a.classList.contains('playStoreLink') ? 'play_store_click' : 'app_store_click', {
				link_url: a.href, transport_type: 'beacon'
			});
		});
	</script>
	{% endif %}
</head>
