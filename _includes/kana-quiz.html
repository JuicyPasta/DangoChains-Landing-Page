<style>
#kq{max-width:var(--w-game);margin:1rem 0 1.5rem}
.kq-controls{display:flex;flex-wrap:wrap;gap:8px 12px;margin-bottom:12px}
.kq-seg{display:flex;flex-wrap:wrap;gap:6px}
.kq-chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-pill);padding:6px 12px;font:inherit;font-weight:700;font-size:var(--fs-s);cursor:pointer}
.kq-chip.is-on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.kq-head{display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-s);margin-bottom:8px}
.kq-card{background:var(--surface-2);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;height:150px;margin-bottom:12px}
.kq-kana{font-family:var(--font-ja);font-size:4.5rem;line-height:1;color:var(--ink)}
.kq-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kq-opt{background:var(--tile);color:var(--ink);border:0;border-radius:var(--r-md);padding:16px 8px;font:inherit;font-size:var(--fs-xl);font-weight:800;cursor:pointer;box-shadow:var(--lip)}
.kq-opt:hover{background:var(--tile-hover)}
.kq-opt.is-good{background:var(--good-bg);color:var(--good);outline:2px solid var(--good)}
.kq-opt.is-bad{background:var(--bad-bg);color:var(--bad);outline:2px solid var(--bad)}
.kq-hint{color:var(--muted);font-size:var(--fs-sm);margin-top:8px}
.kq-done{background:var(--surface-2);border-radius:var(--r-lg);padding:16px 18px}
.kq-score{font-size:var(--fs-3xl);font-weight:900;margin:0}
.kq-missed{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 12px}
.kq-missed span,.kq-missed .kq-say{font-family:var(--font-ja);font-size:1.5em}
.kq-say{background:var(--tile);color:var(--ink);border:0;border-radius:var(--r-sm);padding:0 8px;cursor:pointer;box-shadow:var(--lip)}
.kq-say:hover{background:var(--tile-hover)}
.kq-btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--r-pill);padding:10px 18px;font:inherit;font-weight:800;cursor:pointer}
.kq-cta{margin-top:12px}
</style>
<div id="kq" data-script="{{ include.script | default: 'hiragana' }}"><p>Loading the quiz… (needs JavaScript)</p></div>
<script src="{{ '/assets/js/kana-quiz.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}" defer></script>
